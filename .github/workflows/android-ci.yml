name: Android CI

# RotinaCheck quality gate:
#   1. Static analysis (Android Lint)
#   2. Deterministic unit tests (JUnit 5 — parser, progress, scheduler)
#   3. RELEASE APK assembly (R8-minified, resource-shrunk)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint • Unit Tests • Assemble Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ---- Gate 1: static analysis -------------------------------------------
      - name: Android Lint (debug variant)
        run: ./gradlew :app:lintDebug --stacktrace

      # ---- Gate 2: deterministic logic tests ----------------------------------
      - name: Unit tests (JUnit 5)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # ---- Gate 3: assemble (release = minified + shrunk) ----------------------
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # ---- Artifacts (uploaded even when a gate fails, for post-mortem) --------
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rotinacheck-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
