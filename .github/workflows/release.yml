name: Release

# Tag-driven release: push a tag `v*` → minified release APK is attached to
# a GitHub Release together with its SHA-256 checksum.
# Uses the built-in GITHUB_TOKEN — no PAT required.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build • Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ---- OTA: STABLE release signature --------------------------------------
      # One keystore, created once, cached forever (fixed key). Every published
      # APK keeps the same signature → in-app updates install without
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE. Public repo trade-off: the password
      # lives here; a stable signature beats key secrecy for a sideload app.
      - name: Restore stable release keystore (cached across runs)
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: keystore/rotinacheck-release.keystore
          key: rotina-release-keystore-v1

      - name: Create stable release keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/rotinacheck-release.keystore \
            -storepass "$KEYSTORE_PASS" \
            -alias rotinacheck \
            -keypass "$KEYSTORE_PASS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RotinaCheck, OU=App, O=Chrispsz, C=BR"
        env:
          KEYSTORE_PASS: rotina-check-2026


      - name: Assemble release APK
        env:
          ROTINA_STORE_PASSWORD: rotina-check-2026
          ROTINA_KEY_ALIAS: rotinacheck
          ROTINA_KEY_PASSWORD: rotina-check-2026
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "RotinaCheck-${{ github.ref_name }}.apk"

      - name: Compute SHA-256
        run: |
          sha256sum "RotinaCheck-${{ github.ref_name }}.apk" \
            > "RotinaCheck-${{ github.ref_name }}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RotinaCheck ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-test') }}
          generate_release_notes: true
          files: |
            RotinaCheck-${{ github.ref_name }}.apk
            RotinaCheck-${{ github.ref_name }}.apk.sha256
