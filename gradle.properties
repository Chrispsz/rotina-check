# JVM arguments for the Gradle daemon (Compose is memory-hungry).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Parallel project execution & build cache (CI-friendly).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory for Compose / DataStore.
android.useAndroidX=true
# Generates namespaced R classes only for the declaring module (faster builds).
android.nonTransitiveRClass=true

# Official Kotlin code style (CI lint parity with IDE).
kotlin.code.style=official
